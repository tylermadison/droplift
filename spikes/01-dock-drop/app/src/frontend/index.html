<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>DropliftSpike01</title>
<style>body{font:12px ui-monospace,monospace;margin:12px;background:#fff;color:#111}
@media (prefers-color-scheme:dark){body{background:#1e1e1e;color:#ddd}}
pre{white-space:pre-wrap}</style></head>
<body><b>PROTOTYPE — spike 01 event log</b>
<pre id="log"></pre>
<script>
const el = document.getElementById('log');
const add = (l) => { el.textContent += l + '\n'; };
(async function boot() {
  while (!window.tiny) await new Promise(r => setTimeout(r, 50));
  (await tiny.api.call('getLog')).forEach(add);
  tiny.api.on('log', ({ line }) => add(line));
  document.addEventListener('visibilitychange', () => tiny.api.call('log', { msg: 'page visibility ' + document.visibilityState }).catch(()=>{}));
})();
</script></body></html>
